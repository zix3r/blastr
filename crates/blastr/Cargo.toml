[package]
name = "blastr"
description = "Shows what a Rust code change can affect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["impact-analysis", "rust-analyzer", "git", "code-review", "gui"]
categories = ["development-tools", "gui"]
# `cargo run -p blastr` opens the window; the engine is built beside it.
default-run = "blastr"

[lints]
workspace = true

[[bin]]
name = "blastr"
path = "src/main.rs"

[[bin]]
name = "blastr-engine"
path = "src/bin/blastr-engine.rs"

[dependencies]
blastr-core.workspace = true
blastr-gui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
blastr-model.workspace = true
tempfile.workspace = true
