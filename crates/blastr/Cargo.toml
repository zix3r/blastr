[package]
name = "blastr"
description = "Shows what a Rust code change can affect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["impact-analysis", "rust-analyzer", "git", "code-review", "gui"]
categories = ["development-tools", "gui"]
# `cargo run -p blastr` opens the window; the engine is built beside it.
default-run = "blastr"

[lints]
workspace = true

[[bin]]
name = "blastr"
path = "src/main.rs"

[[bin]]
name = "blastr-engine"
path = "src/bin/blastr-engine.rs"

[[bin]]
name = "blastr-mcp"
path = "src/bin/blastr-mcp.rs"

# This package only holds the three programs. The window is the `blastr-gui`
# library, which depends on blastr-model and blastr-git but not on blastr-core,
# so editing the analysis pipeline does not recompile the interface; only
# `blastr-engine` needs blastr-core. `blastr-mcp`, the MCP server for AI agents,
# is the `blastr-mcp` library.
[dependencies]
blastr-core.workspace = true
blastr-gui.workspace = true
blastr-mcp.workspace = true
blastr-model.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
