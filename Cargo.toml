[workspace]
resolver = "3"
members = ["crates/*"]
# `fixtures` holds projects of their own: Blastr's own builds must not compile them.
exclude = ["fixtures"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zix3r/blastr"

[workspace.dependencies]
blastr-model = { path = "crates/blastr-model", version = "0.2.0" }
blastr-ra = { path = "crates/blastr-ra", version = "0.2.0" }
blastr-git = { path = "crates/blastr-git", version = "0.2.0" }
blastr-core = { path = "crates/blastr-core", version = "0.2.0" }
blastr-gui = { path = "crates/blastr-gui", version = "0.2.0" }

ra_ap_hir = "=0.0.358"
ra_ap_ide = "=0.0.358"
ra_ap_ide_db = "=0.0.358"
ra_ap_load-cargo = "=0.0.358"
ra_ap_paths = "=0.0.358"
ra_ap_project_model = "=0.0.358"
ra_ap_syntax = "=0.0.358"
ra_ap_vfs = "=0.0.358"

gpui-kit = "=0.9.1"

async-channel = "2"
blake3 = "1"
directories = "6"
# Only what blastr-git uses: discovery, rev-parse and log walks (`revision`),
# index, trees and tree-to-tree diffs, ignore files (`excludes`) and `is_dirty`
# (`status`). The default features add network, archive, merge, blame and more.
gix = { version = "0.90", default-features = false, features = ["sha1", "status", "revision", "excludes", "max-performance"] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
thiserror = "2"
toml = "1"
# Held back: ra_ap_hir_def 0.0.358 pins unicode-ident to a Unicode 17 release,
# and ra-ap-rustc_lexer refuses to build unless unicode-properties matches.
unicode-properties = { version = "=0.1.4", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.14"

tempfile = "3"
# Writes the Windows icon and version resource of the executables.
winresource = "0.1.34"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep backtraces useful for our own crates, but skip the full debug info:
# it costs compile and link time and tens of gigabytes of target directory.
[profile.dev]
debug = "line-tables-only"

# No debug info for dependencies.
[profile.dev.package."*"]
debug = false
