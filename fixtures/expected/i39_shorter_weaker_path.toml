# Two changes reach the same hub by paths of different length and strength. The
# strong path is the longer one: `hub` is two resolved calls from the `leaf`
# change, so the hub reports that path, at distance 2. The weak path is the
# shorter one: `hub` takes the changed `hook` as a value, one candidate step from
# that change. The search keeps both, the shortest resolved path and the shortest
# path of any certainty, so `caller` and the test are reached by the strong path
# and the short path adds the evidence that they also depend on `hook`.
crates = ["i39_shorter_weaker_path"]
exact_changes = true
exact_impact = true

[[change]]
kind = "body"
symbol = "i39_shorter_weaker_path::leaf"

[[change]]
kind = "body"
symbol = "i39_shorter_weaker_path::hook"

[[impact]]
symbol = "i39_shorter_weaker_path::step1"
class = "behaviour"
confidence = "likely"
reason = "calls-changed"
distance = 1

# The hub reports its best path, the resolved two-step one from `leaf`.
[[impact]]
symbol = "i39_shorter_weaker_path::hub"
class = "behaviour"
confidence = "likely"
reason = "calls-changed"
distance = 2

# ... and keeps the one-step candidate path as well.
[[impact]]
symbol = "i39_shorter_weaker_path::hub"
reason = "takes-changed-as-value"

# `caller` extends both of the hub's paths, so the `hook` evidence arrives too.
[[impact]]
symbol = "i39_shorter_weaker_path::caller"
class = "behaviour"
confidence = "likely"
reason = "calls-changed"
distance = 3

[[impact]]
symbol = "i39_shorter_weaker_path::caller"
reason = "takes-changed-as-value"

[[impact]]
symbol = "i39_shorter_weaker_path::tests::the_caller_adds_both_routes"
class = "behaviour"
confidence = "likely"
reason = "takes-changed-as-value"
distance = 4
tags = ["test"]

[[selected_test]]
symbol = "i39_shorter_weaker_path::tests::the_caller_adds_both_routes"
reason = "reached"
