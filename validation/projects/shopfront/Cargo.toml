[workspace]
resolver = "3"
members = ["crates/billing", "crates/cli", "crates/domain", "crates/storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain", version = "0.1.0" }
billing = { path = "crates/billing", version = "0.1.0" }
storage = { path = "crates/storage", version = "0.1.0" }
